name: Release

# Push a tag like v0.1.0 to build binaries for every target and attach them to a GitHub
# Release. "Run workflow" in the Actions tab builds and tests everything without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The golden PNGs are generated on macOS arm64, so the test suite only runs there.
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$crate" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$crate" >&2
            exit 1
          fi
      - run: rustup update stable --no-self-update
      - run: cargo test --release

  # License notices for every Rust crate in the binary, generated once and shipped in each archive.
  notices:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: cargo install cargo-about --locked --features cli --version 0.9.3
      - run: cargo about generate about.hbs --locked -o THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt

  build:
    needs: [test, notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            smoke: true
          # Built on the arm64 runner; Apple's clang cross-compiles between its own architectures.
          - target: x86_64-apple-darwin
            os: macos-15
            smoke: false
          # Ubuntu 22.04 keeps the glibc requirement low so the binary runs on older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: notices
      - run: rustup update stable --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test the binary
        if: matrix.smoke
        run: |
          bin=target/${{ matrix.target }}/release/pele-cli
          "$bin" --version
          "$bin" render tests/fixtures/class.mmd -o smoke.png --output text
          test "$(head -c 8 smoke.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
      - name: Package
        run: |
          name="pele-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name/licenses"
          cp "target/${{ matrix.target }}/release/pele-cli" "dist/$name/"
          cp LICENSE THIRD-PARTY-NOTICES.txt "dist/$name/"
          cp assets/PELE-LICENSE "dist/$name/licenses/pele.run-LICENSE"
          cp assets/fonts/INTER-LICENSE.txt assets/fonts/JETBRAINSMONO-LICENSE.txt "dist/$name/licenses/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: pele-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
